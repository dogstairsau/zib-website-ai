<!-- ─── Cheeks & Co Media brand theme · overrides Zib tokens from base.css ───
     Palette + element mapping per the Cheeks & Co brand guidelines.
     Loaded AFTER base.css so these win the cascade. -->
<style>
  :root {
    --bg: #FAF8F5;          /* Warm Cream — page background */
    --paper: #FFFFFF;       /* clean surfaces / input fields */
    --dim: #FDF3F6;         /* soft pink wash */
    --ink: #2C2C2C;         /* Off Black — headings / strong text */
    --ink-2: #2C2C2C;
    --ink-3: #444444;       /* Charcoal — body text */
    --muted: #9C8880;       /* Mauve Gray — captions / dividers */
    --muted-2: #C9899E;     /* Dusty Rose — secondary / icons */
    --rule: #EADfe1;
    --rule-2: #DCC8CF;
    --accent: #D4618A;      /* Deep Rose — links, CTAs, highlights (accessible on light) */
    --accent-tint: #FDD9E8; /* Blush — accent fills */
    --brand-pink: #F9A8C0;  /* Cool Rose Pink — logo / primary brand */

    --display: "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body:    "Jost", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { color: #444444; font-family: var(--body); }
  .site-header .brand img { height: 34px; width: auto; }
  .audit-footer .brand img { height: 30px; width: auto; }
</style>
