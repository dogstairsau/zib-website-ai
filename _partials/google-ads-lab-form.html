<!-- Google Ads Lab · URL capture form. Sits inside a hero container.
     Requires /assets/google-ads-lab.css + /assets/google-ads-lab.js, plus
     _partials/google-ads-lab-flow.html and -booking.html on the same page. -->
      <form id="heroForm" class="gal-form reveal">
        <div class="url-field">
          <span class="url-prefix" aria-hidden="true">https://</span>
          <input id="heroUrl" type="text" name="url" inputmode="url" placeholder="yourwebsite.com.au" autocomplete="url" required />
        </div>
        <button type="submit">Build my Google Ads <span class="arr">→</span></button>
      </form>
      <div class="gal-trust reveal">
        <span><span class="dot"></span>Google Premier Partner</span>
        <span><span class="dot"></span>Top 3% of agencies</span>
        <span><span class="dot"></span>Senior strategist on every account</span>
      </div>
