<!-- ─── Twin Social brand theme · overrides Zib tokens from base.css ───
     Dark theme per twinsocial.com.au: near-black ground, ice-white type,
     signature yellow accent, Syne display + Roboto body.
     Loaded AFTER base.css so these win the cascade. -->
<style>
  :root {
    --bg: #060A0E;          /* Extra Dark — page background */
    --paper: #0D131A;       /* raised dark surfaces / cards */
    --dim: #0A0F15;         /* section wash */
    --ink: #EFF9FC;         /* Ice White — headings / strong text */
    --ink-2: #EFF9FC;
    --ink-3: #C7D3DC;       /* body text */
    --muted: #758696;       /* Slate — captions / dividers */
    --muted-2: #5D6C7B;     /* secondary / icons */
    --rule: rgba(239,249,252,0.10);
    --rule-2: rgba(239,249,252,0.18);
    --accent: #FFEA00;      /* Twin Yellow — links, CTAs, highlights */
    --accent-tint: rgba(255,234,0,0.12);

    /* Score colors brightened for dark ground */
    --score-good: #2FD08A;
    --score-mid:  #FFB020;
    --score-bad:  #FF5C5C;

    --display: "Syne", system-ui, -apple-system, "Segoe UI", sans-serif;
    --body:    "Roboto", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  body { background: var(--bg); color: #C7D3DC; font-family: var(--body); }
  .site-header .brand img { height: 34px; width: auto; }
  .audit-footer .brand img { height: 30px; width: auto; }
  .brand .brand-word {
    font-family: var(--display);
    font-weight: 700;
    font-size: 17px;
    letter-spacing: 0.14em;
    color: var(--ink);
    align-self: center;
    margin-left: 10px;
    white-space: nowrap;
  }
</style>
