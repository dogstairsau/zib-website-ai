<style>
/* ─── Shared styles for legal pages (privacy, terms) ─────────── */
h1, h2, h3 { text-wrap: balance; }

.legal-head {
  padding-top: clamp(56px, 8vw, 104px);
  padding-bottom: clamp(36px, 5vw, 64px);
  border-bottom: 0.5px solid var(--rule);
}

.legal-eyebrow {
  color: var(--accent);
  margin-bottom: clamp(18px, 2.4vw, 26px);
  display: inline-flex;
  align-items: center;
  gap: 10px;
}
.legal-eyebrow::before { content: ""; width: 22px; height: 0.5px; background: currentColor; }

.legal-h {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(42px, 6.4vw, 104px);
  line-height: 0.98;
  letter-spacing: -0.042em;
  max-width: 16ch;
}
.legal-h em { color: var(--accent); font-style: italic; font-weight: 400; }

.legal-sub {
  margin-top: clamp(22px, 3vw, 32px);
  font-family: var(--display);
  font-size: clamp(17px, 1.5vw, 20px);
  line-height: 1.55;
  color: var(--muted);
  max-width: 62ch;
}
.legal-sub strong { color: var(--ink); font-weight: 500; }

.legal-stamp {
  margin-top: clamp(26px, 3vw, 36px);
  display: flex;
  flex-wrap: wrap;
  gap: 10px 28px;
  color: var(--muted-2);
}
.legal-stamp span { display: inline-flex; align-items: center; gap: 8px; }
.legal-stamp b { color: var(--ink); font-weight: 500; }

/* ─── Layout: sticky contents + body ──────────────────────────── */
.legal-wrap {
  padding-top: clamp(48px, 6vw, 80px);
  padding-bottom: clamp(80px, 10vw, 144px);
}

.legal-grid {
  display: grid;
  grid-template-columns: 240px minmax(0, 1fr);
  gap: clamp(32px, 6vw, 96px);
  align-items: start;
}

@media (max-width: 900px) {
  .legal-grid { grid-template-columns: 1fr; gap: 40px; }
}

.legal-toc { position: sticky; top: 96px; }
@media (max-width: 900px) {
  .legal-toc {
    position: static;
    border: 1px solid var(--rule);
    border-radius: 14px;
    padding: 22px 24px;
    background: var(--paper);
  }
}

.legal-toc h2 {
  font-family: var(--mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--muted-2);
  margin-bottom: 18px;
}

.legal-toc ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; counter-reset: toc; }
.legal-toc li { counter-increment: toc; }
.legal-toc a {
  display: grid;
  grid-template-columns: 26px 1fr;
  gap: 4px;
  font-size: 14px;
  line-height: 1.35;
  color: var(--muted);
  transition: color 200ms var(--ease);
}
.legal-toc a::before {
  content: counter(toc, decimal-leading-zero);
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.08em;
  color: var(--muted-2);
  padding-top: 2px;
}
.legal-toc a:hover { color: var(--accent); }
.legal-toc a:hover::before { color: var(--accent); }

/* ─── Prose ───────────────────────────────────────────────────── */
.legal-body {
  max-width: 74ch;
  font-family: var(--display);
  font-size: clamp(16px, 1.3vw, 17.5px);
  line-height: 1.7;
  color: var(--ink-2);
}

.legal-body > * + * { margin-top: 1.3em; }

.legal-body section { scroll-margin-top: 96px; }
.legal-body section + section { margin-top: clamp(48px, 5vw, 72px); }

.legal-body h2 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(24px, 2.8vw, 32px);
  line-height: 1.15;
  letter-spacing: -0.028em;
  color: var(--ink);
  margin-bottom: 0.7em;
  padding-top: 1.1em;
  border-top: 0.5px solid var(--rule);
}

.legal-body section:first-child h2 { padding-top: 0; border-top: 0; }

.legal-body h3 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(18px, 1.8vw, 20px);
  line-height: 1.25;
  letter-spacing: -0.016em;
  color: var(--ink);
  margin-top: 1.8em;
}

.legal-body strong { font-weight: 600; color: var(--ink); }
.legal-body em { font-style: italic; }

.legal-body a {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: opacity 200ms var(--ease);
}
.legal-body a:hover { opacity: 0.7; }

.legal-body ul, .legal-body ol { padding-left: 1.3em; }
.legal-body li + li { margin-top: 0.55em; }
.legal-body li::marker { color: var(--muted-2); }

.legal-body hr { border: 0; border-top: 0.5px solid var(--rule); margin: 2.2em 0; }

/* Callout — used for "what this means in plain English" notes */
.legal-note {
  border-left: 2px solid var(--accent);
  background: var(--paper);
  border-radius: 0 12px 12px 0;
  padding: 20px 24px;
  font-size: 15.5px;
  line-height: 1.6;
  color: var(--ink-2);
}
.legal-note .mono {
  display: block;
  color: var(--accent);
  margin-bottom: 8px;
}

/* Definition-style contact block */
.legal-contact {
  border: 1px solid var(--rule);
  border-radius: 14px;
  padding: clamp(22px, 3vw, 32px);
  background: var(--paper);
}
.legal-contact .mono { color: var(--muted-2); margin-bottom: 14px; display: block; }
.legal-contact .who {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(19px, 2vw, 22px);
  letter-spacing: -0.02em;
  color: var(--ink);
  margin-bottom: 10px;
}
.legal-contact dl { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 8px 16px; margin-top: 4px; }
.legal-contact dt {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--muted-2);
  padding-top: 4px;
}
.legal-contact dd { margin: 0; font-size: 16px; }

/* Third-party table */
.legal-table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.legal-table {
  width: 100%;
  min-width: 560px;
  border-collapse: collapse;
  font-size: 15px;
}
.legal-table th, .legal-table td {
  text-align: left;
  padding: 13px 16px 13px 0;
  border-bottom: 0.5px solid var(--rule);
  vertical-align: top;
}
.legal-table th {
  font-family: var(--mono);
  font-size: 10.5px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  font-weight: 600;
  color: var(--muted-2);
  white-space: nowrap;
}
.legal-table td:first-child { font-weight: 500; color: var(--ink); white-space: nowrap; }

/* Inline "cookie settings" trigger inside prose */
.legal-body button.linklike {
  color: var(--accent);
  text-decoration: underline;
  text-underline-offset: 3px;
  font: inherit;
  padding: 0;
}
.legal-body button.linklike:hover { opacity: 0.7; }

/* ─── Foot CTA ────────────────────────────────────────────────── */
.legal-cta {
  padding-top: clamp(72px, 9vw, 120px);
  padding-bottom: clamp(72px, 9vw, 120px);
  background: var(--ink);
  color: #fff;
}
.legal-cta .eyebrow { color: var(--accent); margin-bottom: 18px; display: inline-flex; align-items: center; gap: 10px; }
.legal-cta .eyebrow::before { content: ""; width: 22px; height: 0.5px; background: currentColor; }
.legal-cta h2 {
  font-family: var(--display);
  font-weight: 500;
  font-size: clamp(32px, 4.8vw, 68px);
  line-height: 1.02;
  letter-spacing: -0.038em;
  max-width: 18ch;
  margin-bottom: clamp(24px, 3vw, 34px);
}
.legal-cta h2 em { color: var(--accent); font-style: italic; font-weight: 400; }
.legal-cta p {
  max-width: 56ch;
  font-size: clamp(16px, 1.4vw, 18px);
  line-height: 1.55;
  color: rgba(255,255,255,0.75);
  margin-bottom: clamp(30px, 4vw, 44px);
}
.legal-cta .row { display: flex; gap: 14px; flex-wrap: wrap; }
.legal-cta .btn-outline { border: 1px solid rgba(255,255,255,0.36); color: #fff; background: transparent; }
.legal-cta .btn-outline:hover { border-color: #fff; background: transparent; color: #fff; }
.legal-cta .btn-primary { background: var(--accent); color: #fff; }
.legal-cta .btn-primary:hover { background: #ff7a24; }
</style>
