name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: node build.mjs
      - name: Audit production dependencies
        # Only deps that actually ship to runtime. The vercel CLI (devDep) has
        # its own advisories that don't reach production, so we scope this.
        run: npm audit --omit=dev --audit-level=high
